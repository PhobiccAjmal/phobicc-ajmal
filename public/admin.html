<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Admin - Phobicc.ajmall
</title>

<link
  rel="stylesheet"
  href="/style.css"
>

</head>


<body>


<main class="main">


<!-- LOGIN -->

<section
  id="loginBox"
  class="panel"
>

<h1 class="rainbow">
  Admin Login
</h1>

<p>
  Only administrator can upload or delete media.
</p>


<form id="loginForm">


<div class="field">

<label for="adminId">
  ID
</label>

<input
  id="adminId"
  autocomplete="username"
  required
>

</div>



<div class="field">

<label for="adminPassword">
  Password
</label>

<input
  id="adminPassword"
  type="password"
  autocomplete="current-password"
  required
>

</div>



<button
  class="btn"
  type="submit"
>
  LOGIN
</button>


<div
  id="loginStatus"
  class="status"
></div>


</form>


<a
  class="pill"
  href="/"
>
  ← Back Home
</a>

</section>



<!-- ADMIN PANEL -->

<section
  id="adminPanel"
  class="panel hidden"
>

<h1 class="rainbow">
  Admin Panel
</h1>



<form id="uploadForm">


<div class="field">

<label for="media">
  Photo or Video
</label>

<input
  id="media"
  name="media"
  type="file"
  accept="image/*,video/*"
  required
>

</div>



<div class="field">

<label for="description">
  Description / Title
</label>

<input
  id="description"
  name="description"
  maxlength="2000"
  placeholder="Example: Wedding Edit"
>

</div>



<div class="field">

<label for="details">
  Details
</label>

<textarea
  id="details"
  name="details"
  maxlength="5000"
  placeholder="Write details about this photo/video..."
></textarea>

</div>



<button
  class="btn"
  type="submit"
>
  UPLOAD
</button>


<button
  class="btn"
  type="button"
  onclick="logout()"
>
  LOGOUT
</button>


<div
  id="uploadStatus"
  class="status"
></div>


</form>



<h2>
  Manage Uploaded Media
</h2>


<div
  id="mediaList"
  class="admin-list"
></div>


</section>


</main>



<script>

const loginBox =
  document.getElementById(
    "loginBox"
  );

const adminPanel =
  document.getElementById(
    "adminPanel"
  );

const loginStatus =
  document.getElementById(
    "loginStatus"
  );

const uploadStatus =
  document.getElementById(
    "uploadStatus"
  );



async function checkSession() {

  const res =
    await fetch(
      "/api/session"
    );

  const data =
    await res.json();


  if (
    data.loggedIn
  ) {

    showPanel();

  } else {

    showLogin();

  }

}



function showLogin() {

  loginBox.classList.remove(
    "hidden"
  );

  adminPanel.classList.add(
    "hidden"
  );

}



function showPanel() {

  loginBox.classList.add(
    "hidden"
  );

  adminPanel.classList.remove(
    "hidden"
  );

  loadAdminMedia();

}



document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      loginStatus.textContent =
        "Checking...";


      const id =
        document
          .getElementById(
            "adminId"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "adminPassword"
          )
          .value;


      try {

        const res =
          await fetch(
            "/api/login",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  id,
                  password
                })
            }
          );


        const data =
          await res.json();


        if (!res.ok) {

          throw new Error(
            data.error ||
            "Login failed."
          );

        }


        loginStatus.textContent =
          "";

        showPanel();


      } catch (error) {

        loginStatus.textContent =
          error.message;

      }

    }
  );



document
  .getElementById(
    "uploadForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const form =
        new FormData(
          event.target
        );


      uploadStatus.textContent =
        "Uploading...";


      try {

        const res =
          await fetch(
            "/api/upload",
            {
              method:
                "POST",

              body:
                form
            }
          );


        const data =
          await res.json();


        if (!res.ok) {

          throw new Error(
            data.error ||
            "Upload failed."
          );

        }


        uploadStatus.textContent =
          "Uploaded successfully.";


        event.target.reset();


        loadAdminMedia();


      } catch (error) {

        uploadStatus.textContent =
          error.message;

      }

    }
  );



async function loadAdminMedia() {

  const box =
    document.getElementById(
      "mediaList"
    );


  box.innerHTML =
    '<div class="small">Loading...</div>';


  try {

    const res =
      await fetch(
        "/api/media"
      );


    const items =
      await res.json();


    if (
      !items.length
    ) {

      box.innerHTML =
        '<div class="small">Nothing uploaded yet.</div>';

      return;

    }


    box.innerHTML =
      items
        .map(
          item => {

            const preview =
              item.media_type ===
              "video"

                ?

`<video
  src="${esc(item.url)}"
  controls
  muted
  preload="metadata"
></video>`

                :

`<img
  src="${esc(item.url)}"
  alt=""
>`;


            return `

<div class="admin-item">

${preview}

<div class="admin-info">

<strong>
${esc(
  item.description ||
  item.filename
)}
</strong>

<div class="small">
${esc(item.filename)}
</div>

</div>


<button
  class="btn danger"
  onclick="deleteMedia(${Number(item.id)})"
>
  DELETE
</button>

</div>

`;

          }
        )
        .join("");


  } catch {

    box.innerHTML =
      '<div class="small">Could not load media.</div>';

  }

}



async function deleteMedia(id) {

  if (
    !confirm(
      "Delete this photo/video permanently?"
    )
  ) {

    return;

  }


  const res =
    await fetch(
      "/api/media/" +
      id,
      {
        method:
          "DELETE"
      }
    );


  const data =
    await res.json();


  if (!res.ok) {

    alert(
      data.error ||
      "Delete failed."
    );

    return;

  }


  loadAdminMedia();

}



async function logout() {

  await fetch(
    "/api/logout",
    {
      method:
        "POST"
    }
  );


  showLogin();


  document.getElementById(
    "adminPassword"
  ).value = "";

}



function esc(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      character =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character])
    );

}


checkSession();

</script>


</body>

</html>
