<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Admin - Phobicc.ajmall
</title>

<link
  rel="stylesheet"
  href="/style.css"
>

<!-- SUPABASE JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<main class="main">


<!-- =========================
     LOGIN
========================= -->

<section
  id="loginBox"
  class="panel"
>

<h1 class="rainbow">
  Admin Login
</h1>

<p>
  Only administrator can upload or delete media.
</p>


<form id="loginForm">


<div class="field">

<label for="adminId">
  ID
</label>

<input
  id="adminId"
  autocomplete="username"
  required
>

</div>



<div class="field">

<label for="adminPassword">
  Password
</label>

<input
  id="adminPassword"
  type="password"
  autocomplete="current-password"
  required
>

</div>



<button
  class="btn"
  type="submit"
>
  LOGIN
</button>


<div
  id="loginStatus"
  class="status"
></div>


</form>


<a
  class="pill"
  href="/"
>
  ← Back Home
</a>

</section>



<!-- =========================
     ADMIN PANEL
========================= -->

<section
  id="adminPanel"
  class="panel hidden"
>

<h1 class="rainbow">
  Admin Panel
</h1>



<form id="uploadForm">


<div class="field">

<label for="media">
  Photo or Video
</label>

<input
  id="media"
  name="media"
  type="file"
  accept="image/*,video/*"
  required
>

</div>



<div class="field">

<label for="description">
  Description / Title
</label>

<input
  id="description"
  name="description"
  maxlength="2000"
  placeholder="Example: Wedding Edit"
>

</div>



<div class="field">

<label for="details">
  Details
</label>

<textarea
  id="details"
  name="details"
  maxlength="5000"
  placeholder="Write details about this photo/video..."
></textarea>

</div>



<button
  class="btn"
  type="submit"
  id="uploadButton"
>
  UPLOAD
</button>


<button
  class="btn"
  type="button"
  onclick="logout()"
>
  LOGOUT
</button>


<div
  id="uploadStatus"
  class="status"
></div>


</form>



<h2>
  Manage Uploaded Media
</h2>


<div
  id="mediaList"
  class="admin-list"
></div>


</section>


</main>



<script>

/* =========================
   ELEMENTS
========================= */

const loginBox =
  document.getElementById(
    "loginBox"
  );

const adminPanel =
  document.getElementById(
    "adminPanel"
  );

const loginStatus =
  document.getElementById(
    "loginStatus"
  );

const uploadStatus =
  document.getElementById(
    "uploadStatus"
  );

const uploadButton =
  document.getElementById(
    "uploadButton"
  );


/* =========================
   SUPABASE
========================= */

let supabaseClient = null;


/* =========================
   LOAD SUPABASE CONFIG
========================= */

async function initSupabase() {

  const res =
    await fetch(
      "/api/public-config"
    );


  const data =
    await res.json();


  if (!res.ok) {

    throw new Error(
      data.error ||
      "Supabase configuration failed."
    );

  }


  supabaseClient =
    window.supabase.createClient(
      data.url,
      data.anonKey
    );

}


/* =========================
   SESSION CHECK
========================= */

async function checkSession() {

  try {

    const res =
      await fetch(
        "/api/session"
      );


    const data =
      await res.json();


    if (
      data.loggedIn
    ) {

      showPanel();

    } else {

      showLogin();

    }

  } catch {

    showLogin();

  }

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin() {

  loginBox.classList.remove(
    "hidden"
  );

  adminPanel.classList.add(
    "hidden"
  );

}


/* =========================
   SHOW ADMIN PANEL
========================= */

function showPanel() {

  loginBox.classList.add(
    "hidden"
  );

  adminPanel.classList.remove(
    "hidden"
  );

  loadAdminMedia();

}


/* =========================
   LOGIN
========================= */

document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      loginStatus.textContent =
        "Checking...";


      const id =
        document
          .getElementById(
            "adminId"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "adminPassword"
          )
          .value;


      try {

        const res =
          await fetch(
            "/api/login",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  id,
                  password
                })
            }
          );


        const data =
          await res.json();


        if (!res.ok) {

          throw new Error(
            data.error ||
            "Login failed."
          );

        }


        loginStatus.textContent =
          "";

        showPanel();


      } catch (error) {

        loginStatus.textContent =
          error.message;

      }

    }
  );


/* =========================
   NEW LARGE FILE UPLOAD
========================= */

document
  .getElementById(
    "uploadForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const fileInput =
        document.getElementById(
          "media"
        );


      const file =
        fileInput.files[0];


      if (!file) {

        uploadStatus.textContent =
          "Choose a photo or video.";

        return;

      }


      const description =
        document
          .getElementById(
            "description"
          )
          .value
          .trim();


      const details =
        document
          .getElementById(
            "details"
          )
          .value
          .trim();


      try {

        /* =========================
           DISABLE BUTTON
        ========================= */

        uploadButton.disabled =
          true;

        uploadButton.textContent =
          "UPLOADING...";


        /* =========================
           INITIALIZE SUPABASE
        ========================= */

        uploadStatus.textContent =
          "Preparing upload...";


        if (!supabaseClient) {

          await initSupabase();

        }


        /* =========================
           STEP 1
           GET SIGNED UPLOAD URL
        ========================= */

        const urlResponse =
          await fetch(
            "/api/upload-url",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  filename:
                    file.name,

                  contentType:
                    file.type
                })
            }
          );


        const urlData =
          await urlResponse.json();


        if (!urlResponse.ok) {

          throw new Error(
            urlData.error ||
            "Could not prepare upload."
          );

        }


        /* =========================
           STEP 2
           DIRECT UPLOAD TO SUPABASE
        ========================= */

        uploadStatus.textContent =
          "Uploading directly to storage...";


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("media")
            .uploadToSignedUrl(
              urlData.path,
              urlData.token,
              file,
              {
                contentType:
                  file.type,

                upsert:
                  false
              }
            );


        if (uploadError) {

          throw new Error(
            uploadError.message
          );

        }


        /* =========================
           STEP 3
           SAVE DATABASE RECORD
        ========================= */

        uploadStatus.textContent =
          "Saving media information...";


        const completeResponse =
          await fetch(
            "/api/complete-upload",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  filename:
                    file.name,

                  storagePath:
                    urlData.path,

                  description:
                    description,

                  details:
                    details,

                  mediaType:
                    file.type.startsWith(
                      "video/"
                    )
                      ? "video"
                      : "image"

                })
            }
          );


        const completeData =
          await completeResponse.json();


        if (!completeResponse.ok) {

          throw new Error(
            completeData.error ||
            "Could not save media."
          );

        }


        /* =========================
           SUCCESS
        ========================= */

        uploadStatus.textContent =
          "Uploaded successfully.";


        event.target.reset();


        loadAdminMedia();


      } catch (error) {

        console.error(
          "UPLOAD ERROR:",
          error
        );


        uploadStatus.textContent =
          "Upload failed: " +
          error.message;


      } finally {

        uploadButton.disabled =
          false;

        uploadButton.textContent =
          "UPLOAD";

      }

    }
  );


/* =========================
   LOAD MEDIA
========================= */

async function loadAdminMedia() {

  const box =
    document.getElementById(
      "mediaList"
    );


  box.innerHTML =
    '<div class="small">Loading...</div>';


  try {

    const res =
      await fetch(
        "/api/media"
      );


    const items =
      await res.json();


    if (!res.ok) {

      throw new Error(
        items.error ||
        "Could not load media."
      );

    }


    if (
      !items.length
    ) {

      box.innerHTML =
        '<div class="small">Nothing uploaded yet.</div>';

      return;

    }


    box.innerHTML =
      items
        .map(
          item => {

            const preview =
              item.media_type ===
              "video"

                ?

`<video
  src="${esc(item.url)}"
  controls
  muted
  preload="metadata"
></video>`

                :

`<img
  src="${esc(item.url)}"
  alt=""
>`;


            return `

<div class="admin-item">

${preview}

<div class="admin-info">

<strong>
${esc(
  item.description ||
  item.filename
)}
</strong>

<div class="small">
${esc(item.filename)}
</div>

</div>


<button
  class="btn danger"
  onclick="deleteMedia(${Number(item.id)})"
>
  DELETE
</button>

</div>

`;

          }
        )
        .join("");


  } catch (error) {

    console.error(error);

    box.innerHTML =
      '<div class="small">Could not load media.</div>';

  }

}


/* =========================
   DELETE MEDIA
========================= */

async function deleteMedia(id) {

  if (
    !confirm(
      "Delete this photo/video permanently?"
    )
  ) {

    return;

  }


  try {

    const res =
      await fetch(
        "/api/media/" +
        id,
        {
          method:
            "DELETE"
        }
      );


    const data =
      await res.json();


    if (!res.ok) {

      alert(
        data.error ||
        "Delete failed."
      );

      return;

    }


    loadAdminMedia();


  } catch (error) {

    alert(
      error.message ||
      "Delete failed."
    );

  }

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await fetch(
    "/api/logout",
    {
      method:
        "POST"
    }
  );


  showLogin();


  document.getElementById(
    "adminPassword"
  ).value = "";

}


/* =========================
   ESCAPE HTML
========================= */

function esc(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      character =>
        ({
          "&":
            "&amp;",

          "<":
            "&lt;",

          ">":
            "&gt;",

          '"':
            "&quot;",

          "'":
            "&#039;"

        }[character])
    );

}


/* =========================
   START
========================= */

checkSession();

</script>


</body>

</html>
