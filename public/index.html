<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Phobicc.ajmall
</title>

<link
  rel="stylesheet"
  href="/style.css"
>

</head>


<body>


<!-- INTRO -->

<div
  id="intro"
  class="intro"
>

  <div
    id="introText"
    class="welcome rainbow"
  >
    WELCOME
  </div>

</div>


<!-- HEADER -->

<header class="topbar">

<nav class="nav">

<div class="navleft">

<h1 class="logo rainbow">
  Phobicc.ajmall
</h1>

<a
  class="insta"
  href="https://www.instagram.com/phobicc.ajmall?stkn=dHgyeTd1MW04c3Zn"
  target="_blank"
  rel="noopener"
>
  phobicc.ajmall
</a>

</div>


<a
  class="login"
  href="/admin"
>
  LOGIN
</a>

</nav>

</header>



<main class="main">


<section class="hero">

<h1 class="rainbow">
  Phobicc.ajmall
</h1>

<p>
  Photos • Videos • Creative Work
</p>

</section>



<!-- MEDIA -->

<section
  id="mediaGrid"
  class="media-grid"
>

<div class="empty">
  Loading photos and videos...
</div>

</section>



<!-- BUTTONS -->

<div class="actions">

<a
  class="pill"
  href="https://wa.me/919846913984?text=Hi%20Phobicc.ajmall%2C%20I%20would%20like%20to%20contact%20you%20about%20a%20work."
  target="_blank"
  rel="noopener"
>
  CONTACT ME
</a>


<a
  class="pill"
  href="/about"
>
  ABOUT
</a>

</div>



<footer class="footer">

©
<span id="year"></span>
Phobicc.ajmall

</footer>


</main>



<script>

const intro =
  document.getElementById(
    "intro"
  );

const introText =
  document.getElementById(
    "introText"
  );


/*
10 seconds:
WELCOME
*/

setTimeout(
  () => {

    introText.className =
      "brandIntro rainbow";

    introText.textContent =
      "Phobicc.ajmall";

  },
  10000
);


/*
20 seconds:
Open website
*/

setTimeout(
  () => {

    intro.classList.add(
      "hide"
    );

  },
  20000
);


document.getElementById(
  "year"
).textContent =
  new Date().getFullYear();



async function loadMedia() {

  const grid =
    document.getElementById(
      "mediaGrid"
    );

  try {

    const res =
      await fetch(
        "/api/media"
      );

    const items =
      await res.json();


    if (
      !Array.isArray(items) ||
      items.length === 0
    ) {

      grid.innerHTML =
        '<div class="empty">No photos or videos uploaded yet.</div>';

      return;
    }


    grid.innerHTML =
      items
        .map(
          (item, i) => {

            const media =
              item.media_type ===
              "video"

                ?

                `<video
                  src="${escapeAttr(item.url)}"
                  controls
                  playsinline
                  preload="metadata"
                ></video>`

                :

                `<img
                  src="${escapeAttr(item.url)}"
                  alt="${escapeAttr(item.description || "Phobicc.ajmall photo")}"
                  loading="lazy"
                >`;


            return `

<article
  class="card"
  style="animation-delay:${Math.min(i,10)*.05}s"
>

${media}

<div class="card-body">

${
  item.description
    ?
`<h3>${escapeHtml(
  item.description
)}</h3>`
    : ""
}

${
  item.details
    ?
`<p>${escapeHtml(
  item.details
)}</p>`
    : ""
}

</div>

</article>

`;

          }
        )
        .join("");


  } catch (error) {

    grid.innerHTML =
      '<div class="empty">Could not load media. Please try again later.</div>';

  }

}


function escapeHtml(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      character =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character])
    );

}


function escapeAttr(value) {

  return escapeHtml(value);

}


loadMedia();

</script>


</body>

</html>
