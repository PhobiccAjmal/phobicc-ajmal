<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phobicc.ajmall</title>

  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>

    /* =========================
       INSTAGRAM
    ========================= */

    .navleft {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .insta {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-decoration: none;
      color: white;

      margin-top: 5px;
      text-align: center;

      transition: 0.2s;
    }

    .insta i {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .insta span {
      font-size: 15px;
      font-weight: 500;
    }

    .insta small {
      font-size: 12px;
      margin-top: 4px;
      opacity: 0.8;
    }

    .insta:hover {
      transform: scale(1.05);
    }

    .insta:hover i {
      color: #e1306c;
    }

  </style>

</head>


<body>


  <!-- =========================
       INTRO
  ========================= -->

  <div id="intro">

    <!-- WELCOME -->
    <div id="welcomeScreen">

      <h1>
        WELCOME
      </h1>

    </div>


    <!-- BRAND -->
    <div id="brandScreen">

      <h1 class="rainbow">
        Phobicc.ajmall
      </h1>

    </div>

  </div>



  <!-- =========================
       MAIN WEBSITE
  ========================= -->

  <div id="mainSite">


    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

      <nav class="nav">


        <!-- LEFT / BRAND -->

        <div class="navleft">

          <h1 class="logo rainbow">
            Phobicc.ajmall
          </h1>


          <!-- INSTAGRAM -->

          <a
            class="insta"
            href="https://www.instagram.com/phobicc.ajmall?stkn=dHgyeTd1MW04c3Zn"
            target="_blank"
            rel="noopener"
          >

            <i class="fa-brands fa-instagram"></i>

            <span>
              phobicc.ajmall
            </span>

            <small>
              Follow my page
            </small>

          </a>

        </div>


        <!-- LOGIN -->

        <a
          class="login"
          href="/admin"
        >
          LOGIN
        </a>


      </nav>

    </header>



    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

      <h1 class="rainbow">
        Phobicc.ajmall
      </h1>

      <p>
        Photography • Videography • Editing
      </p>

    </section>



    <!-- =========================
         MEDIA
    ========================= -->

    <section class="media-section">

      <h2>
        My Works
      </h2>


      <div id="mediaContainer">

        <!-- Photos and videos appear here -->

      </div>

    </section>



    <!-- =========================
         CONTACT
    ========================= -->

    <section class="contact-section">

      <a
        class="contact-btn"
        href="https://wa.me/919846913984?text=Hello%20Ajmal"
        target="_blank"
        rel="noopener"
      >
        CONTACT ME
      </a>

    </section>



    <!-- =========================
         ABOUT
    ========================= -->

    <section class="about-section">

      <a
        class="about-btn"
        href="/about"
      >
        ABOUT
      </a>

    </section>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

      <p>
        © 2026 Phobicc.ajmall
      </p>

    </footer>


  </div>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>


    /* =========================
       INTRO ANIMATION
    ========================= */

    const intro =
      document.getElementById("intro");

    const welcomeScreen =
      document.getElementById("welcomeScreen");

    const brandScreen =
      document.getElementById("brandScreen");

    const mainSite =
      document.getElementById("mainSite");


    // Main website hidden initially

    mainSite.style.display = "none";


    // WELCOME = 5 SECONDS

    setTimeout(() => {

      welcomeScreen.style.display = "none";

      brandScreen.style.display = "flex";

    }, 5000);


    // PHOBICC.AJMALL = ANOTHER 5 SECONDS

    setTimeout(() => {

      intro.style.display = "none";

      mainSite.style.display = "block";

    }, 10000);



    /* =========================
       LOAD MEDIA
    ========================= */

    async function loadMedia() {

      const container =
        document.getElementById("mediaContainer");


      try {

        const response =
          await fetch("/api/media");


        if (!response.ok) {

          throw new Error(
            "Failed to load media"
          );

        }


        const media =
          await response.json();


        container.innerHTML = "";


        /* NO MEDIA */

        if (!media.length) {

          container.innerHTML = `

            <p class="no-media">
              No photos or videos uploaded yet.
            </p>

          `;

          return;

        }


        /* =========================
           EACH MEDIA
        ========================= */

        media.forEach(item => {


          const wrapper =
            document.createElement("div");


          wrapper.className =
            "media-item";


          /* =========================
             IMAGE
          ========================= */

          if (
            item.media_type &&
            item.media_type.startsWith("image")
          ) {


            wrapper.innerHTML = `

              <img
                src="/uploads/${encodeURIComponent(item.filename)}"
                alt="${item.description || "Photo"}"
                loading="lazy"
              >


              ${
                item.description
                  ? `<h3>${escapeHtml(item.description)}</h3>`
                  : ""
              }


              ${
                item.details
                  ? `<p>${escapeHtml(item.details)}</p>`
                  : ""
              }

            `;


          }


          /* =========================
             VIDEO
          ========================= */

          else {


            wrapper.innerHTML = `

              <video
                controls
                preload="metadata"
              >

                <source
                  src="/uploads/${encodeURIComponent(item.filename)}"
                >

                Your browser does not support video.

              </video>


              ${
                item.description
                  ? `<h3>${escapeHtml(item.description)}</h3>`
                  : ""
              }


              ${
                item.details
                  ? `<p>${escapeHtml(item.details)}</p>`
                  : ""
              }

            `;

          }


          container.appendChild(wrapper);


        });


      }


      catch (error) {


        console.error(error);


        container.innerHTML = `

          <p class="error">
            Unable to load photos and videos.
          </p>

        `;


      }

    }



    /* =========================
       HTML ESCAPE
    ========================= */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    }



    /* =========================
       LOAD MEDIA
    ========================= */

    loadMedia();


  </script>


</body>

</html>
